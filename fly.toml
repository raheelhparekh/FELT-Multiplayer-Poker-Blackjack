# fly.toml app configuration file for Felt
app = "felt-blackjack"
primary_region = "bom" # Mumbai, India (use 'sin' for Singapore if bom unavailable)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[services.http_checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"
  protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
